<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" xml:lang="en" aria-labelledby="title description">
<title id="title">Enterprise Campus Network logical topology</title>
<desc id="description">Three departments, a guest VLAN on ASW-SALES, two multilayer switches connected by LACP, an internal server and simulated Internet access. DSW1 is the STP root and active HSRP gateway. DSW2 is the standby. Each distribution switch has a routed link to EDGE-R1.</desc>
