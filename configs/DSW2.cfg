
version 12.2(37)SE1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption

hostname DSW2


no profinet





ip routing















spanning-tree mode rapid-pvst
spanning-tree vlan 10,20,30,40,50,99,999 priority 28672






interface Port-channel1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999
 switchport trunk encapsulation dot1q
 switchport mode trunk

interface Port-channel2
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999
 switchport trunk encapsulation dot1q
 switchport mode trunk

interface FastEthernet0/1
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,99,999
 switchport trunk encapsulation dot1q
 switchport mode trunk

interface FastEthernet0/2
 switchport trunk native vlan 999
 switchport trunk allowed vlan 20,99,999
 switchport trunk encapsulation dot1q
 switchport mode trunk

interface FastEthernet0/3
 switchport trunk native vlan 999
 switchport trunk allowed vlan 30,50,99,999
 switchport trunk encapsulation dot1q
 switchport mode trunk

interface FastEthernet0/4

interface FastEthernet0/5

interface FastEthernet0/6

interface FastEthernet0/7

interface FastEthernet0/8

interface FastEthernet0/9

interface FastEthernet0/10

interface FastEthernet0/11

interface FastEthernet0/12

interface FastEthernet0/13

interface FastEthernet0/14

interface FastEthernet0/15

interface FastEthernet0/16

interface FastEthernet0/17

interface FastEthernet0/18

interface FastEthernet0/19

interface FastEthernet0/20

interface FastEthernet0/21
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 2 mode active

interface FastEthernet0/22
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 2 mode active

interface FastEthernet0/23
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
 shutdown

interface FastEthernet0/24
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999
 switchport trunk encapsulation dot1q
 switchport mode trunk
 channel-group 1 mode active
 shutdown

interface GigabitEthernet0/1
 no switchport
 ip address 10.255.0.6 255.255.255.252
 duplex auto
 speed auto

interface GigabitEthernet0/2

interface Vlan1
 no ip address
 shutdown

interface Vlan10
 mac-address 00e0.f7c0.4601
 ip address 192.168.10.3 255.255.255.0
 standby 10 ip 192.168.10.1

interface Vlan20
 mac-address 00e0.f7c0.4602
 ip address 192.168.20.3 255.255.255.0
 standby 20 ip 192.168.20.1

interface Vlan30
 mac-address 00e0.f7c0.4603
 ip address 192.168.30.3 255.255.255.0
 standby 30 ip 192.168.30.1

interface Vlan40
 mac-address 00e0.f7c0.4606
 ip address 192.168.40.3 255.255.255.0
 standby 40 ip 192.168.40.1

interface Vlan50
 mac-address 00e0.f7c0.4604
 ip address 192.168.50.3 255.255.255.0
 ip helper-address 192.168.40.10
 standby 50 ip 192.168.50.1

interface Vlan99
 mac-address 00e0.f7c0.4605
 ip address 192.168.99.3 255.255.255.0
 standby 99 ip 192.168.99.1

router ospf 1
 router-id 10.255.0.6
 log-adjacency-changes
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface Vlan10
 no passive-interface Vlan20
 no passive-interface Vlan30
 no passive-interface Vlan50
 no passive-interface Vlan99
 no passive-interface Vlan40
 no passive-interface Port-channel1
 no passive-interface Port-channel2
 network 10.255.0.4 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.50.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0

ip classless

ip flow-export version 9


ip access-list extended ACCOUNTING-IN
 deny ip 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255
 permit ip any any
ip access-list extended SALES-IN
 deny ip 192.168.30.0 0.0.0.255 192.168.20.0 0.0.0.255
 permit ip any any
ip access-list extended VLAN50-HSRP-IN
 permit udp host 192.168.50.2 host 224.0.0.2 eq 1985
 permit udp host 192.168.50.3 host 224.0.0.2 eq 1985
 permit udp any eq bootpc host 255.255.255.255 eq bootps
 permit udp 192.168.50.0 0.0.0.255 eq bootpc host 192.168.40.10 eq bootps
 permit icmp 192.168.50.0 0.0.0.255 host 203.0.113.10 echo
 permit tcp 192.168.50.0 0.0.0.255 host 203.0.113.10 eq www
 deny ip any any






line con 0

line aux 0

line vty 0 4
 login




end

